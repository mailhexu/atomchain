# MULTIBINIT Configuration for BaHfO3 (Barium Hafnate)
# =======================================================
# BaHfO3 is a ferroelectric material with a perovskite structure.
# This example demonstrates relaxation and phonon calculations using an
# effective potential from MULTIBINIT.
#
# Prerequisites:
# - DDB file from ABINIT DFPT calculation
# - XML file with effective Hamiltonian coefficients
# - These must be generated beforehand using ABINIT+MULTIBINIT

[files]
# DDB file (derivative database) containing force constants
# Generated by ABINIT's DFPT calculation
ddb_file = BaHfO3_DDB

# System XML file with effective Hamiltonian
# Generated by MULTIBINIT training on anharmonic forces
sys_file = BaHfO3.xml

[parameters]
# Supercell dimensions: 1×1×1 unit cell (5 atoms)
# Larger supercells capture longer-range interactions but are slower
ncell = 2 2 2

# Q-point grid used in DFT calculation
# Must match the grid used when generating the DDB
ngqpt = 4 4 4

# Enable dipole-dipole interactions (crucial for ferroelectrics!)
# BaHfO3 has strong long-range electrostatic interactions
dipdip = 1

[backend]
# PyMultibinit always uses Angstrom/eV units for ASE compatibility
# Unit conversions to/from atomic units (Bohr/Hartree) are handled automatically

# Enable automatic atom matching (handles PBC and atom ordering)
auto_match_atoms = true
match_tolerance = 0.1

# Optional: Specify path to libabinit if not in standard location
# lib_path = /path/to/libabinit.so
