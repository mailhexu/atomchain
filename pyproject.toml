[project]
name = "atomchain"
version = "0.3.3"
description = "A library to chain the atomic models with applications"
authors = [
    {name = "Xu He", email = "mailhexu@gmail.com"},
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "BSD-2"}
dependencies = [
    "numpy",
    "matplotlib",
    "ase",
    "phonopy==3.0.0",
    "pyyaml",
    "pathos",
    "scipy",
    "spgrep-modulation>=0.2.5",
]


classifiers = [
  # How mature is this project? Common values are
  #   3 - Alpha
  #   4 - Beta
  #   5 - Production/Stable
  "Development Status :: 3 - Alpha",

  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",

  "License :: OSI Approved :: BSD License",

  # Specify the Python versions you support here.
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
mlrelax = "atomchain.relax:mlrelax_cli"
mlphonon = "atomchain.phonon.mlphonon:mlphonon_cli"
mlgap = "atomchain.gap:mlgap_cli"
mlsinglepoint = "atomchain.singlepoint:mlsinglepoint_cli"
mlsupercell = "atomchain.supercell:mlsupercell_cli"
mlrattle = "atomchain.rattle:mlrattle_cli"
mlbatch = "atomchain.batch:mlbatch_cli"
mlcompare = "atomchain.compare:mlcompare_cli"
mlneb = "atomchain.neb:mlneb_cli"
mlcollect = "atomchain.collect:mlcollect_cli"
mlconvert = "atomchain.convert:mlconvert_cli"
mlmetastable = "atomchain.metastable_cli:mlmetastable_cli"
mlddb = "atomchain.ddb.cli:mlddb_cli"
mlhist = "atomchain.training.cli:mlhist_cli"
mltraining = "atomchain.training.cli:mltraining_cli"
mlmp = "atomchain.materials_project:mlmp_cli"
mlmbmodel = "atomchain.multibinit_workflow:mlmbmodel_cli"
mlbvmodel = "atomchain.bondvalence_workflow:mlbvmodel_cli"

[build-system]
requires = ["hatchling>=1.12.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    "/examples",
    "/.opencode",
    "/.omo",
    "/.serena",
    "/.venv",
    "/.pytest_cache",
    "/.ruff_cache",
    "/build",
    "/dist",
    "/node_modules",
]

[tool.hatch.build.targets.wheel]
packages = ["atomchain"]



[tool.pdm]
distribution = true

[project.optional-dependencies]
test=[
    "pytest>=6.2.0",
]

dev=[
    "pytest>=6.2.0",
    "black>=21.6b0",
    "pre-commit>=2.13.0",
    "sphinx>=4.1.2",
]

mace=[
    "mace-torch",
]

materials-project=[
    "mp-api",
]
#bondvalence=[
#    "easybondvalence",
#]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
