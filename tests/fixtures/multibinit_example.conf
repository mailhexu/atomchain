# MULTIBINIT Example Configuration File
# ========================================
# This is a minimal example configuration for testing purposes.
# For actual use, you need real DDB and XML files from ABINIT calculations.

[files]
# DDB file (derivative database) from DFPT calculation
ddb_file = example_DDB

# System XML file with effective Hamiltonian coefficients
sys_file = example.xml

[parameters]
# Supercell dimensions [nx, ny, nz]
ncell = 2 2 2

# Q-point grid [nqx, nqy, nqz]
ngqpt = 4 4 4

# Dipole-dipole interactions (0=off, 1=on)
dipdip = 1

[backend]
# Backend selection: ctypes (default) or cffi
backend = ctypes

# Use Angstrom/eV (false) or Bohr/Hartree (true)
use_atomic_units = false
